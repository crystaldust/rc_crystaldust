# Local demo configuration (docs/testing/local-testing.md).
#
# Every destination points at spike/mock-vendor on 127.0.0.1:18080, so the hub
# can run end to end on a laptop. scripts/demo.sh starts everything and sets
# the mock behaviours; the three destinations show the three outcomes:
#   vendor-a  success on the first attempt (secret, HMAC signature, masking)
#   vendor-b  first two attempts fail with 500, then success (retry + backoff)
#   vendor-c  HTTP 200 with {"code":1001} -> DEAD (PoC S3), replayable
#
# No credential appears here: secrets are env: references, API keys are
# referenced by the SHA-256 of the key (generated by `messagehub keygen`).
version: 1

principals:
  - id: demo-source
    role: source
    api_key_sha256_ref: env:HUB_KEY_DEMO_SOURCE_SHA256
  - id: demo-operator
    role: operator
    api_key_sha256_ref: env:HUB_KEY_DEMO_OPERATOR_SHA256

policies:
  # Short backoff so retries are visible within seconds.
  - id: demo
    timeout: 2s
    retry:
      max_attempts: 3
      backoff: { initial: 1s, multiplier: 2.0, max: 10s, jitter: 0 }
      retry_on: { status: [429, "5xx"] }
    success:
      status: ["2xx"]
    ordering: { mode: none }

  # The vendor answers 200 even for business errors; success needs code 0.
  - id: demo-business-code
    timeout: 2s
    retry:
      max_attempts: 3
      backoff: { initial: 1s, multiplier: 2.0, max: 10s, jitter: 0 }
      retry_on: { status: [429, "5xx"] }
    success:
      status: ["2xx"]
      body:
        - { path: code, op: eq, value: 0 }
    ordering: { mode: none }

destinations:
  - id: vendor-a
    policy: demo
    secrets:
      TOKEN: env:DEMO_VENDOR_TOKEN
    request:
      method: POST
      url: "http://127.0.0.1:18080/vendor-a/hook?api_key={{ secret.TOKEN }}"
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ secret.TOKEN }}"
        X-Signature: "{{ request.body | hmac_sha256_hex secret.TOKEN }}"
      body:
        order_id: "{{ event.payload.order_id }}"
        amount: "{{ event.payload.amount }}"
        paid_at: "{{ event.occurred_at }}"

  - id: vendor-b
    policy: demo
    request:
      method: POST
      url: "http://127.0.0.1:18080/vendor-b/hook"
      headers:
        Content-Type: application/json
      body:
        event_id: "{{ event.id }}"
        order_id: "{{ event.payload.order_id }}"

  - id: vendor-c
    policy: demo-business-code
    request:
      method: POST
      url: "http://127.0.0.1:18080/vendor-c/hook"
      headers:
        Content-Type: application/json
      body:
        event_id: "{{ event.id }}"

routes:
  - id: demo-fanout
    event_type: order.paid
    sources: [demo-source]
    destinations: [vendor-a, vendor-b, vendor-c]
